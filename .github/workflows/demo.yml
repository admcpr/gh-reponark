name: Demo

# Records demo.gif from demo.tape against the built-in demo data and attaches
# it to a release, where the README loads it from
# releases/latest/download/demo.gif. Nothing is committed, so this works with
# a protected main branch. The release workflow calls it after publishing;
# run it by hand from the Actions tab to refresh the latest release's GIF.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the recording to (defaults to the latest)
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  record:
    name: Record and attach demo.gif
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pick the release
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and put `gh reponark` on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.release.outputs.tag }}" -o "$RUNNER_TEMP/bin/gh-reponark" .
          # The tape types `gh reponark`, so a shim named gh runs the build for
          # that and hands everything else to the real gh CLI, which later
          # steps (the release upload) still need.
          real_gh="$(command -v gh)"
          cat > "$RUNNER_TEMP/bin/gh" <<SHIM
          #!/bin/sh
          if [ "\$1" = reponark ]; then
            shift
            exec "$RUNNER_TEMP/bin/gh-reponark" "\$@"
          fi
          exec "$real_gh" "\$@"
          SHIM
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape
          install-fonts: true
      - name: Attach to the release
        run: gh release upload "${{ steps.release.outputs.tag }}" demo.gif --clobber --repo "$GITHUB_REPOSITORY"
