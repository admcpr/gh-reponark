name: CI

# Runs on every pull request, and on main through the release workflow,
# which calls it before tagging.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./... && go vet -tags capture ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # PowerShell splits `-coverprofile=coverage.out` into pieces on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out

  build:
    # The test matrix compiles natively for Linux and Windows; this
    # cross-compiles the other release targets (macOS is not tested, so both
    # of its architectures are built here) in one job, so a platform-specific
    # build break is caught before the release workflow hits it. Each target
    # takes a few seconds once modules are cached, so one job beats a matrix.
    name: Cross-compile
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build for each remaining target
        run: |
          for target in linux/arm64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null .
            echo "::endgroup::"
          done
